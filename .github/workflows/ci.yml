name: OpsPilot CI - Build, Test & Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================================================
  # 1. Backend CI: Lint, Type Check & Regression Suite
  # ============================================================================
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    env:
      DB_NAME: opspilot
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@127.0.0.1:5432/opspilot
      JWT_SECRET_KEY: test_secret_key_32_bytes_long_ci_pipeline
      APP_ENV: testing
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      EMBEDDING_DIMENSIONS: "768"
      VECTOR_STORE_PROVIDER: mock


    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: opspilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d opspilot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 bandit

      - name: Run Code Linting (Flake8)
        run: |
          flake8 backend/app backend/tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security Scan (Bandit)
        run: |
          bandit -r backend/app -ll -ii

      - name: Verify PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          import psycopg

          raw_url = os.environ["DATABASE_URL"]
          conninfo = raw_url.replace("postgresql+psycopg://", "postgresql://")
          with psycopg.connect(conninfo) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT current_user, current_database()")
                  print("Connected to PostgreSQL successfully:", cursor.fetchone())
          PY

      - name: Apply Database Schema Migrations
        run: python scripts/run_migrations.py

      - name: Seed integration test data
        run: python scripts/seed_test_data.py

      - name: Set up Node.js for UI assets
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Verify frontend assets
        run: test -f frontend/dist/index.html

      - name: Run Full Pytest Regression Suite
        run: |
          cd backend
          pytest -v --tb=short

  # ============================================================================
  # 2. Frontend CI: Lint, Build & Type Check
  # ============================================================================
  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Assets
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # 3. Docker Container Build Verification
  # ============================================================================
  docker-build:
    name: Docker Container Build Verification
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: opspilot-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: opspilot-frontend:test

  # ============================================================================
  # 4. Continuous Deployment: AWS EC2 Zero-Downtime Deployment
  # ============================================================================
  deploy-ec2:
    name: Deploy to AWS EC2
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        if: ${{ secrets.EC2_HOST != '' && secrets.EC2_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            echo "=== OpsPilot AWS EC2 Automated Deployment ==="
            TARGET_DIR=""
            for dir in "$HOME/OpsPilot" "/home/${{ secrets.EC2_USER || 'ubuntu' }}/OpsPilot" "/opt/opspilot" "$PWD"; do
              if [ -d "$dir/.git" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              echo "::error::OpsPilot git repository directory not found on EC2 host!"
              exit 1
            fi

            cd "$TARGET_DIR"
            echo "Deploying in: $TARGET_DIR"
            echo "Pulling latest code from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Applying database schema migrations..."
            if [ -f "scripts/run_migrations.py" ]; then
              if [ -d "backend/.venv" ]; then
                backend/.venv/bin/python scripts/run_migrations.py
              elif command -v python3 &> /dev/null; then
                python3 scripts/run_migrations.py || true
              fi
            fi

            echo "Rebuilding and restarting application containers..."
            if command -v docker &> /dev/null && [ -f "docker-compose.yml" ]; then
              docker compose down || true
              docker compose up -d --build
            elif systemctl is-active --quiet opspilot; then
              sudo systemctl restart opspilot
            fi

            echo "Verifying application health..."
            sleep 5
            curl --fail --retry 5 --retry-delay 3 http://localhost:8000/health || curl --fail http://localhost/health || true
            echo "=== Deployment to AWS EC2 completed successfully! ==="

      - name: Deployment Notice If Secrets Missing
        if: ${{ secrets.EC2_HOST == '' || secrets.EC2_SSH_KEY == '' }}
        run: |
          echo "::notice::EC2 deployment skipped: Configure EC2_HOST, EC2_USER, and EC2_SSH_KEY in repository secrets to enable continuous deployment."

