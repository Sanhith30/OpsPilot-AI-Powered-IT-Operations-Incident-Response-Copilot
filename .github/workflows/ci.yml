name: OpsPilot CI - Build, Test & Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================================================
  # 1. Backend CI: Lint, Type Check & Regression Suite
  # ============================================================================
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    env:
      DB_NAME: opspilot
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@127.0.0.1:5432/opspilot
      JWT_SECRET_KEY: test_secret_key_32_bytes_long_ci_pipeline
      APP_ENV: testing

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: opspilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d opspilot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 bandit

      - name: Run Code Linting (Flake8)
        run: |
          flake8 backend/app backend/tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security Scan (Bandit)
        run: |
          bandit -r backend/app -ll -ii

      - name: Verify PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          import psycopg

          raw_url = os.environ["DATABASE_URL"]
          conninfo = raw_url.replace("postgresql+psycopg://", "postgresql://")
          with psycopg.connect(conninfo) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT current_user, current_database()")
                  print("Connected to PostgreSQL successfully:", cursor.fetchone())
          PY

      - name: Apply Database Schema Migrations
        run: python scripts/run_migrations.py

      - name: Run Full Pytest Regression Suite
        run: |
          cd backend
          pytest -v --tb=short

  # ============================================================================
  # 2. Frontend CI: Lint, Build & Type Check
  # ============================================================================
  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Assets
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # 3. Docker Container Build Verification
  # ============================================================================
  docker-build:
    name: Docker Container Build Verification
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: opspilot-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: opspilot-frontend:test
