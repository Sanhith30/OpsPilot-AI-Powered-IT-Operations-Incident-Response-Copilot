services:
  prometheus:
    image: prom/prometheus:latest
    container_name: opspilot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  loki:
    image: grafana/loki:3.7.8
    container_name: opspilot-loki
    restart: unless-stopped
    user: "0"
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/tmp/loki
    command:
      - "-config.file=/etc/loki/loki.yaml"

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    container_name: opspilot-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: opspilot-otel-collector
    restart: unless-stopped
    ports:
      - "4319:4317"
      - "4320:4318"
      - "8888:8888"
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    depends_on:
      - jaeger

  alloy:
    image: grafana/alloy:latest
    container_name: opspilot-alloy
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - "run"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.2
    container_name: opspilot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  alloy_data:
